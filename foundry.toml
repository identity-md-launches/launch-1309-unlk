[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 40
fail_on_revert = false

[fmt]
line_length = 110

[lint]
# Foundry 1.8.3 unfiltered lint exhausts memory on this callback/deployment graph.
# scripts/check.sh runs explicit high/medium source lint separately; see docs/VALIDATION.md.
lint_on_build = false
# Analyze deployable source. Local fixtures embed/mined-deploy entire systems and are not production code.
ignore = ["test/**", "script/**"]
